name: cifarx
description: "A simple Flutter app that fetches and displays a paginated product list from a JSON API"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  fpdart: ^1.1.1
  go_router: ^16.3.0
  retrofit: ^4.4.2
  logger: ^2.6.2  # for logging purpose
  json_annotation: ^4.9.0
  get_it: ^8.2.0
  dio: ^5.9.0

dev_dependencies:
  build_runner: ^2.4.13
  json_serializable: ^6.6.1
  retrofit_generator: ^9.1.5


  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
